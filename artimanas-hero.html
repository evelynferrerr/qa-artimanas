<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artimañas Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap">
<style>
/* Layout: hero a pantalla completa. Fondo = escenario fijo 1440×900 del Figma escalado tipo "cover"; contenido responsive encima. */
:root{
  color-scheme: dark;
  --surface-0:#110910;   /* surface/surface_0 */
  --bg-indigo:#3415ae;
  --text-base:#f5f4f5;   /* text/text_base */
  --text-white:#ffffff;  /* text/text_white */
  --sans:-apple-system,"SF Pro Text","SF Pro",BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;
  --pad-x:80px;
  /* curvas */
  --fade:cubic-bezier(.33,1,.68,1);
  --settle:cubic-bezier(.16,1,.3,1);       /* arranca ágil y frena muy suave, sin pasarse */
  --enter:cubic-bezier(.22,1,.36,1);
  --draw:cubic-bezier(.65,0,.35,1);
  --breathe:cubic-bezier(.37,0,.63,1);     /* seno: ida y vuelta pareja */
  --logo-small:.42;
}
html,body{height:100%}
body{margin:0;background:var(--surface-0);color:var(--text-base);font-family:var(--sans);overflow:hidden}
.hero{position:relative;height:100%;min-height:520px;overflow:hidden;isolation:isolate}

/* ---------- Fondo ---------- */
.bg{position:absolute;inset:0;overflow:hidden;background:var(--bg-indigo);z-index:0}
.stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform-origin:center;transform:translate(-50%,-50%) scale(var(--s,1))}
.stage img,.stage .fade{position:absolute;display:block;max-width:none}
.blob-r{left:504.75px;top:-502.96px;width:1404.7px;height:1908.55px}
.blob-l{left:-577.43px;top:-357px;width:1337.06px;height:1718.38px}
.blob-l img{position:static;width:100%;height:100%;transform:scaleX(-1)}
.blob-wrap{position:absolute;will-change:transform}
.fade{left:0;top:704px;width:1440px;height:603px;background:linear-gradient(to bottom,rgba(17,9,16,0) 0%,var(--surface-0) 50.48%)}
.grain{position:absolute;inset:-50%;z-index:1;pointer-events:none;opacity:.22;mix-blend-mode:overlay;background-repeat:repeat;animation:grain 900ms steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* ---------- Contenido ---------- */
.content{position:relative;z-index:2;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-bottom:80px;
  padding-top:env(safe-area-inset-top,0px)}
.nav{width:100%;height:72px;display:flex;align-items:center;justify-content:space-between;position:relative;
  padding-left:max(var(--pad-x),env(safe-area-inset-left,0px));padding-right:max(var(--pad-x),env(safe-area-inset-right,0px));box-sizing:border-box}
.nav a{color:var(--text-base);text-decoration:none;font-size:16px;line-height:24px;padding:8px;display:inline-flex;align-items:center;gap:8px;border-radius:4px}
.nav a:focus-visible{outline:2px solid var(--text-white);outline-offset:2px}
/* punto indicador: se apaga en el ítem anterior (100→0) y se enciende en el nuevo (0→100) */
.nav-dot{position:absolute;left:0;top:0;width:6px;height:6px;pointer-events:none;transform:translate3d(var(--dx,0px),var(--dy,0px),0)}
.nav-dot i{display:block;width:100%;height:100%;border-radius:50%;background:var(--text-base);
  transition:transform 240ms cubic-bezier(.4,0,.2,1),opacity 240ms cubic-bezier(.4,0,.2,1)}
.nav-dot.out i{transform:scale(0);opacity:0;transition:transform 160ms cubic-bezier(.4,0,1,1),opacity 160ms cubic-bezier(.4,0,1,1)}
.nav .center{position:absolute;left:50%;transform:translateX(-50%)}
.nav .m-only{display:none}

.mark{display:flex;flex-direction:column;align-items:center;width:min(1066px,90vw)}
.label{position:relative;display:flex;align-items:center;justify-content:center;height:64px;padding:0 40px;margin-bottom:-16px;transform:rotate(2.48deg);z-index:1}
.label svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.label ellipse{fill:none;stroke:var(--text-white);stroke-width:1.5}
.label span{position:relative;font-size:18px;line-height:28px;color:var(--text-white);white-space:nowrap}
.logo{position:relative;width:min(1007.5px,86vw);aspect-ratio:1007.507/181.769}
.logo img{position:absolute;top:-2.43%;bottom:-2.43%;left:-.44%;right:-.44%;width:100.88%;height:104.86%;display:block}
.logo,.logo img,.nav,.banner-clip,.label{will-change:transform,opacity}

/* recorta solo a los costados: la cinta inclinada sube/baja más cuanto más ancha es la pantalla */
.banner-clip{width:100%;overflow-x:clip;overflow-y:visible}
.banner{width:112%;margin-left:-6%;transform:rotate(-1.3deg);border-block:2px solid var(--text-white);padding-block:24px;overflow:hidden}
.track{display:flex;width:max-content;animation:marquee 48s linear infinite;animation-play-state:paused}
.track span{font-size:18px;line-height:28px;color:var(--text-white);white-space:nowrap;padding-right:24px}
@keyframes marquee{to{transform:translateX(-50%)}}

/* ---------- Secuencia de carga ---------- */
/* 1 · cargando: logo chico y centrado que se achica y se agranda suave (ciclos de 1200 ms) */
.hero .nav{transform:translateY(-100%);opacity:0}
.hero .banner-clip{transform:translateY(110%);opacity:0}
.hero .label{opacity:0}
.hero .label span{opacity:0}
.hero .label ellipse{stroke-dasharray:1;stroke-dashoffset:1}
.logo{transform:translateY(var(--center-shift,0px)) scale(var(--logo-small));opacity:0}
.hero.intro .logo{opacity:1;transition:opacity 400ms var(--fade)}
.hero.loading .logo img{animation:pulse 1200ms var(--breathe) infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}

/* 2 · cargado: el logo crece a su tamaño y entran barra, cinta y label (sin rebotes) */
.hero.ready .logo{transform:translateY(0) scale(1);opacity:1;transition:transform 800ms var(--settle)}
.hero.ready .nav{transform:none;opacity:1;transition:transform 640ms var(--enter) 120ms,opacity 400ms var(--fade) 120ms}
.hero.ready .banner-clip{transform:none;opacity:1;transition:transform 640ms var(--enter) 120ms,opacity 400ms var(--fade) 120ms}
/* el label se dibuja: aparece el trazo del óvalo y después el texto */
.hero.ready .label{opacity:1;transition:opacity 200ms linear 320ms}
.hero.ready .label ellipse{stroke-dashoffset:0;transition:stroke-dashoffset 800ms var(--draw) 320ms}
.hero.ready .label span{opacity:1;transition:opacity 400ms var(--fade) 720ms}
.hero.ready .track{animation-play-state:running}

.replay{position:absolute;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  font:12px/1 var(--sans);color:var(--text-base);background:rgba(17,9,16,.48);border:0;border-radius:1000px;padding:8px 12px;cursor:pointer;opacity:.56;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.replay:hover,.replay:focus-visible{opacity:1}
.replay:focus-visible{outline:2px solid var(--text-white);outline-offset:2px}

@media (max-width:900px){:root{--pad-x:32px}}
@media (max-width:640px){
  :root{--pad-x:16px}
  .nav .d-only{display:none}
  .nav .m-only{display:inline-flex}
  .label{height:48px;padding:0 24px;margin-bottom:-8px}
  .label span{font-size:14px;line-height:20px}
  .track span{font-size:14px;line-height:20px;padding-right:18px}
  .banner{padding-block:16px}
  .content{padding-bottom:48px}
}
@media (prefers-reduced-motion:reduce){
  .hero.loading .logo img{animation:none}
  .logo{transform:translateY(var(--center-shift,0px)) scale(var(--logo-small))!important}
  .hero.ready .logo{transform:none!important}
  .hero .nav,.hero .banner-clip{transform:none!important}
  .hero.ready .label ellipse{transition-duration:10ms!important}
  .nav-dot i{transition-duration:10ms!important}
  .grain{animation:none}
  .track{animation-duration:160s}
}
</style>
</head>

    var n=nav.getBoundingClientRect(),r=a.getBoundingClientRect();
    dot.style.setProperty('--dx',(r.right-n.left)+'px');          // 8px después del texto (padding del ítem)
    dot.style.setProperty('--dy',(r.top-n.top+r.height/2-3)+'px'); // centrado vertical del punto de 6px
  }
  function place(a,instant){
    if(!a||a.offsetParent===null){dot.hidden=true;return;}
    dot.hidden=false;
    if(instant||current===null){clearTimeout(swap);current=a;setPos(a);dot.classList.remove('out');return;}
    if(a===current)return;
    current=a;clearTimeout(swap);
    dot.classList.add('out');
    swap=setTimeout(function(){setPos(current);void dot.offsetWidth;dot.classList.remove('out');},OUT_MS);
  }
  links.forEach(function(a){
    a.addEventListener('pointerenter',function(){place(a);});
    a.addEventListener('focus',function(){place(a);});
    a.addEventListener('click',function(e){e.preventDefault();links.forEach(function(l){l.removeAttribute('aria-current');});a.setAttribute('aria-current','page');active=a;place(a);});
  });
  nav.addEventListener('pointerleave',function(){place(active);});
  nav.addEventListener('focusout',function(e){if(!nav.contains(e.relatedTarget))place(active);});
  addEventListener('resize',function(){place(current,true);});
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){place(active,true);});

  /* Marquee: contenido del Banner del Figma, duplicado para el loop */
  var items=["Taller de Diseño Multimedial V","*","Universidad Nacional de La Plata","*","2026","*"];
  var seq=[];for(var i=0;i<4;i++)seq=seq.concat(items);
  document.getElementById('track').innerHTML=seq.concat(seq).map(function(t){return '<span>'+t+'</span>';}).join('');

  /* Fondo escalado tipo cover */
  function fit(){
    var s=Math.max(innerWidth/1440,innerHeight/900);
    stage.style.setProperty('--s',s);
    // durante la carga el logo se centra exacto en la pantalla
    if(!hero.classList.contains('ready')){
      logo.style.setProperty('--center-shift','0px');
      var r=logo.getBoundingClientRect();
      logo.style.setProperty('--center-shift',(innerHeight/2-(r.top+r.height/2))+'px');
    }
  }
  addEventListener('resize',fit);

  /* Grano */
  try{
    var c=document.createElement('canvas');c.width=c.height=160;var x=c.getContext('2d'),d=x.createImageData(160,160);
    for(var p=0;p<d.data.length;p+=4){var v=Math.random()*255|0;d.data[p]=d.data[p+1]=d.data[p+2]=v;d.data[p+3]=255;}
    x.putImageData(d,0,0);document.getElementById('grain').style.backgroundImage='url('+c.toDataURL()+')';
  }catch(e){}

  /* Parallax leve con el cursor (anotación del Figma, ref. monopo.london) */
  var bR=document.getElementById('bR'),bL=document.getElementById('bL'),tx=0,ty=0,cx=0,cy=0,t0=performance.now();
  if(!reduce){
    addEventListener('pointermove',function(e){tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1;});
    (function loop(now){
      cx+=(tx-cx)*.05;cy+=(ty-cy)*.05;
      var drift=Math.sin((now-t0)/2600)*10; // respiración del fondo
      bR.style.transform='translate('+(cx*-28+drift)+'px,'+(cy*-18)+'px)';
      bL.style.transform='translate('+(cx*22-drift)+'px,'+(cy*14)+'px)';
      requestAnimationFrame(loop);
    })(t0);
  }

  /* Secuencia: el logo late mientras carga; al cerrar un ciclo (escala 1, sin salto) entra el resto */
  var runId=0,pulses=0,loadedOk=false,run=0;
  function finish(){hero.classList.remove('loading');hero.classList.add('ready');}
  logoImg.addEventListener('animationiteration',function(){
    pulses++;
    if(loadedOk&&pulses>=MIN_PULSES&&hero.classList.contains('loading'))finish();
  });
  function start(){
    run=++runId;pulses=0;loadedOk=false;
    hero.classList.remove('ready','intro');hero.classList.add('loading');
    fit();
    void hero.offsetWidth;
    requestAnimationFrame(function(){hero.classList.add('intro');});
    var myRun=run;
    var loaded=document.readyState==='complete'?Promise.resolve():new Promise(function(r){addEventListener('load',r,{once:true});});
    loaded.then(function(){
      if(myRun!==runId)return;
      loadedOk=true;
      if(reduce)setTimeout(function(){if(myRun===runId)finish();},MIN_LOADING_REDUCED);
    });
    // respaldo: si el navegador pausa la animación (pestaña en segundo plano), termina igual a los 4000 ms
    setTimeout(function(){if(myRun===runId&&hero.classList.contains('loading'))finish();},4000);
  }
  document.getElementById('replay').addEventListener('click',start);
  start();
})();
</script>

</body>
</html>
